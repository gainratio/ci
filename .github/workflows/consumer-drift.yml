name: Dagger fleet policy

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dagger-fleet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fleet:
    name: Dagger fleet policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          # Engine config: Docker Hub pulls go through the mirrors in .github/xdg/dagger/engine.json.
          XDG_CONFIG_HOME: ${{ github.workspace }}/.github/xdg
          # Engine from the GHCR mirror by digest (gainratio/ci docs/dagger-modules.md).
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: image://ghcr.io/gainratio/mirror/registry.dagger.io/engine:v0.21.10@sha256:2a7c054e0864e297671c24a0726ebf1c9747d70291b8843b1726daaff200a334
          GITHUB_TOKEN: ${{ secrets.CONSUMER_DRIFT_TOKEN }}
        with:
          version: "0.21.10"
          verb: call
          args: >-
            fleet --github-token=env:GITHUB_TOKEN
            ${{ github.ref == 'refs/heads/main' && '--include-central' || '' }}
