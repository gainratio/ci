# Keep THIS repo's full-SHA action pins current in one place. Dependabot's
# github-actions ecosystem walks `uses:` refs in .github/workflows, updating both
# each SHA and its trailing `# v...` comment. A dagger/dagger-for-github bump also
# needs its new SHA added by hand to COMPATIBLE_DAGGER_ACTIONS in
# .dagger/src/ci/fleet_policy.py: that list is the reviewed-revision control for the
# action that runs with fleet secrets (a bare 40-hex pin would accept an impostor
# commit from a fork). Our OWN gainratio/ci refs must be full commit SHAs and never a
# moving `@ci-vN` tag; consumers pin a SHA too, so a bump reaches them when they re-pin.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types: ["minor", "patch"]
    ignore:
      # Major versions are migrated by hand, never by Dependabot.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "ci"
